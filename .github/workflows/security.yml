name: Secret scan
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned scanner and verify published checksum
        env:
          VERSION: 8.30.1
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_checksums.txt" -o /tmp/checksums.txt
          EXPECTED=$(awk '/linux_x64.tar.gz$/ {print $1}' /tmp/checksums.txt)
          echo "$EXPECTED  /tmp/gitleaks.tar.gz" | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
      - name: Scan current source; historical findings are tracked in SECURITY.md
        run: /tmp/gitleaks dir --redact=100 --no-banner .
