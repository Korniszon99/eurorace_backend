name: Geospatial backend checks
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DEBUG: "1"
      DB_NAME: eurorace
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      REDIS_URL: redis://127.0.0.1:6379/0
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: eurorace
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y libgdal-dev libgeos-dev
      - run: python -m pip install .
      - run: python manage.py check && python manage.py makemigrations --check --dry-run
      - run: python manage.py test
      - name: Build deployment container
        run: docker build -t eurorace-ci .
      - name: Audit installed dependencies
        run: python -m pip install pip-audit && python -m pip_audit
