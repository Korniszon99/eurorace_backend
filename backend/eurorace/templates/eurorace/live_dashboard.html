<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eurorace live</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111827;
      color: #f9fafb;
    }
    header {
      padding: 1rem;
      background: #030712;
      border-bottom: 1px solid #374151;
    }
    main {
      display: grid;
      grid-template-columns: minmax(0, 2fr) minmax(320px, 1fr);
      min-height: calc(100vh - 70px);
    }
    #map {
      min-height: 560px;
    }
    #teams {
      overflow: auto;
      padding: 1rem;
      background: #111827;
    }
    .team-card {
      border: 1px solid #374151;
      border-radius: 12px;
      padding: 1rem;
      margin-bottom: 1rem;
      background: #1f2937;
    }
    .team-card h2 {
      margin: 0 0 .5rem;
      font-size: 1.1rem;
    }
    .meta {
      color: #d1d5db;
      font-size: .9rem;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: .5rem;
      margin-top: .75rem;
    }
    .stat {
      background: #111827;
      border-radius: 8px;
      padding: .5rem;
    }
    .stat strong {
      display: block;
      font-size: 1.05rem;
    }
    .recommendations {
      margin-top: .75rem;
      padding-left: 1.25rem;
    }
    @media (max-width: 900px) {
      main {
        grid-template-columns: 1fr;
      }
      #map {
        min-height: 420px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Eurorace live</h1>
    <div class="meta">Pozycje, statystyki i zadania uczestników odświeżane automatycznie.</div>
  </header>
  <main>
    <div id="map"></div>
    <section id="teams" aria-live="polite"></section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map("map").setView([52.2297, 21.0122], 6);
    const markers = new Map();

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap"
    }).addTo(map);

    function formatDistance(meters) {
      if (!meters) return "0 km";
      return `${(meters / 1000).toFixed(1)} km`;
    }

    function formatDuration(seconds) {
      if (!seconds) return "0 h";
      const hours = Math.floor(seconds / 3600);
      const minutes = Math.floor((seconds % 3600) / 60);
      return `${hours} h ${minutes} min`;
    }

    function renderTeams(teams) {
      const panel = document.getElementById("teams");
      panel.innerHTML = "";
      const seen = new Set();

      teams.forEach((team) => {
        const location = team.location;
        if (location) {
          const latLng = [location.latitude, location.longitude];
          seen.add(team.team_id);
          if (markers.has(team.team_id)) {
            markers.get(team.team_id).setLatLng(latLng);
          } else {
            markers.set(
              team.team_id,
              L.marker(latLng).addTo(map)
            );
          }
          markers.get(team.team_id).bindPopup(`<strong>${team.bib_number || ""} ${team.display_name}</strong>`);
        }

        const stats = team.statistics || {};
        const card = document.createElement("article");
        card.className = "team-card";
        card.innerHTML = `
          <h2>${team.bib_number ? `#${team.bib_number} ` : ""}${team.display_name}</h2>
          <div class="meta">${team.members.join(", ") || "Brak wpisanych członków"}</div>
          <div class="stats">
            <div class="stat"><span>Trasa</span><strong>${formatDistance(stats.distance_meters)}</strong></div>
            <div class="stat"><span>Czas</span><strong>${formatDuration(stats.duration_seconds)}</strong></div>
            <div class="stat"><span>Przewyższenia</span><strong>${Math.round(stats.elevation_gain_meters || 0)} m</strong></div>
            <div class="stat"><span>Stopy</span><strong>${stats.hitch_count || 0}</strong></div>
            <div class="stat"><span>Zadania</span><strong>${team.tasks.completed}/${team.tasks.total}</strong></div>
            <div class="stat"><span>Ostatnia pozycja</span><strong>${location ? new Date(location.timestamp).toLocaleTimeString("pl-PL") : "-"}</strong></div>
          </div>
          ${
            team.recommendations.length
              ? `<h3>Najbliższe miejsca do stopa</h3><ol class="recommendations">${team.recommendations.map((rec) => `<li>${rec.spot.title} (${formatDistance(rec.distance_meters)})</li>`).join("")}</ol>`
              : ""
          }
        `;
        panel.appendChild(card);
      });

      for (const [teamId, marker] of markers.entries()) {
        if (!seen.has(teamId)) {
          marker.remove();
          markers.delete(teamId);
        }
      }
    }

    async function refresh() {
      const response = await fetch("{% url 'live-dashboard-data' %}");
      const data = await response.json();
      renderTeams(data.teams);
    }

    refresh();
    setInterval(refresh, 15000);
  </script>
</body>
</html>
