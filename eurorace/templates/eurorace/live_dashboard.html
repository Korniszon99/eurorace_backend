<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eurorace live</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111827;
      color: #f9fafb;
    }
    header {
      padding: 1rem;
      background: #030712;
      border-bottom: 1px solid #374151;
    }
    main {
      display: grid;
      grid-template-columns: minmax(0, 2fr) minmax(320px, 1fr);
      min-height: calc(100vh - 70px);
    }
    #map {
      min-height: 560px;
    }
    #teams {
      overflow: auto;
      padding: 1rem;
      background: #111827;
    }
    .team-card {
      border: 1px solid #374151;
      border-radius: 12px;
      padding: 1rem;
      margin-bottom: 1rem;
      background: #1f2937;
    }
    .team-card h2 {
      margin: 0 0 .5rem;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      gap: .5rem;
    }
    .team-avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #4ade80;
    }
    .meta {
      color: #d1d5db;
      font-size: .9rem;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: .5rem;
      margin-top: .75rem;
    }
    .stat {
      background: #111827;
      border-radius: 8px;
      padding: .5rem;
    }
    .stat strong {
      display: block;
      font-size: 1.05rem;
    }
    .recommendations {
      margin-top: .75rem;
      padding-left: 1.25rem;
    }
    .member-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid #fff;
      box-shadow: 0 0 0 1px rgba(0,0,0,.3);
      display: inline-block;
    }
    @media (max-width: 900px) {
      main {
        grid-template-columns: 1fr;
      }
      #map {
        min-height: 420px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Eurorace live</h1>
    <div class="meta">Pozycje, statystyki i zadania uczestników odświeżane automatycznie.</div>
  </header>
  <main>
    <div id="map"></div>
    <section id="teams" aria-live="polite"></section>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map("map").setView([52.2297, 21.0122], 6);
    const markers = new Map();
    let destinationMarker = null;
    const teamColors = ["#22c55e", "#3b82f6", "#f59e0b", "#ef4444", "#a855f7", "#14b8a6"];

    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap"
    }).addTo(map);

    function formatDistance(meters) {
      if (!meters) return "0 km";
      return `${(meters / 1000).toFixed(1)} km`;
    }

    function formatDuration(seconds) {
      if (!seconds) return "0 h";
      const hours = Math.floor(seconds / 3600);
      const minutes = Math.floor((seconds % 3600) / 60);
      return `${hours} h ${minutes} min`;
    }

    function markerKey(teamId, memberId) {
      return `${teamId}:${memberId ?? "default"}`;
    }

    function createDotIcon(color) {
      return L.divIcon({
        className: "",
        html: `<span class="member-dot" style="background:${color}"></span>`,
        iconSize: [18, 18],
        iconAnchor: [9, 9],
      });
    }

    function createPhotoIcon(photoUrl) {
      return L.divIcon({
        className: "",
        html: `<img src="${photoUrl}" class="team-avatar" alt="">`,
        iconSize: [36, 36],
        iconAnchor: [18, 18],
      });
    }

    function renderDestination(destination) {
      if (!destination) {
        if (destinationMarker) {
          destinationMarker.remove();
          destinationMarker = null;
        }
        return;
      }
      const latLng = [destination.latitude, destination.longitude];
      const label = destination.name || "Meta";
      if (destinationMarker) {
        destinationMarker.setLatLng(latLng);
        destinationMarker.bindPopup(`<strong>Meta: ${label}</strong>`);
      } else {
        destinationMarker = L.marker(latLng, {
          icon: L.divIcon({
            className: "",
            html: `<span style="background:#ef4444;color:#fff;padding:4px 8px;border-radius:999px;font-size:12px;font-weight:700;">META</span>`,
            iconAnchor: [24, 12],
          }),
        }).addTo(map).bindPopup(`<strong>Meta: ${label}</strong>`);
      }
    }

    function renderTeams(teams) {
      const panel = document.getElementById("teams");
      panel.innerHTML = "";
      const seen = new Set();

      teams.forEach((team, teamIndex) => {
        const color = teamColors[teamIndex % teamColors.length];
        const locations = team.member_locations?.length
          ? team.member_locations
          : (team.location ? [team.location] : []);

        locations.forEach((location) => {
          const key = markerKey(team.team_id, location.member_id);
          seen.add(key);
          const latLng = [location.latitude, location.longitude];
          const icon = team.profile_photo_url
            ? createPhotoIcon(team.profile_photo_url)
            : createDotIcon(color);
          const popup = `<strong>${team.bib_number ? `#${team.bib_number} ` : ""}${team.display_name}</strong><br>${location.member_name || ""}`;
          if (markers.has(key)) {
            markers.get(key).setLatLng(latLng);
            markers.get(key).setIcon(icon);
            markers.get(key).bindPopup(popup);
          } else {
            markers.set(key, L.marker(latLng, { icon }).addTo(map).bindPopup(popup));
          }
        });

        const stats = team.statistics || {};
        const card = document.createElement("article");
        card.className = "team-card";
        const avatar = team.profile_photo_url
          ? `<img src="${team.profile_photo_url}" class="team-avatar" alt="">`
          : `<span class="member-dot" style="background:${color}"></span>`;
        card.innerHTML = `
          <h2>${avatar} ${team.bib_number ? `#${team.bib_number} ` : ""}${team.display_name}</h2>
          <div class="meta">${team.members.join(", ") || "Brak wpisanych członków"}</div>
          <div class="stats">
            <div class="stat"><span>Trasa</span><strong>${formatDistance(stats.distance_meters)}</strong></div>
            <div class="stat"><span>Czas</span><strong>${formatDuration(stats.duration_seconds)}</strong></div>
            <div class="stat"><span>Przewyższenia</span><strong>${Math.round(stats.elevation_gain_meters || 0)} m</strong></div>
            <div class="stat"><span>Stopy</span><strong>${stats.hitch_count || 0}</strong></div>
            <div class="stat"><span>Zadania</span><strong>${team.tasks.completed}/${team.tasks.total}</strong></div>
            <div class="stat"><span>Pozycje</span><strong>${locations.length || 0}</strong></div>
          </div>
          ${
            team.recommendations.length
              ? `<h3>Najbliższe miejsca do stopa</h3><ol class="recommendations">${team.recommendations.map((rec) => `<li>${rec.spot.title} (${formatDistance(rec.distance_meters)})</li>`).join("")}</ol>`
              : ""
          }
        `;
        panel.appendChild(card);
      });

      for (const [key, marker] of markers.entries()) {
        if (!seen.has(key)) {
          marker.remove();
          markers.delete(key);
        }
      }
    }

    async function refresh() {
      const response = await fetch("{% url 'live-dashboard-data' %}");
      const data = await response.json();
      renderDestination(data.destination);
      renderTeams(data.teams);
    }

    refresh();
    setInterval(refresh, 15000);
  </script>
</body>
</html>
