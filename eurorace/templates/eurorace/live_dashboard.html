<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eurorace live</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
  <style>
    :root {
      --header-h: 72px;
      --sidebar-w: 380px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111827;
      color: #f9fafb;
      overflow: hidden;
      height: 100vh;
    }
    header {
      height: var(--header-h);
      padding: 0 1rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background: #030712;
      border-bottom: 1px solid #374151;
      flex-shrink: 0;
    }
    header h1 {
      margin: 0;
      font-size: 1.35rem;
    }
    main {
      display: flex;
      align-items: stretch;
      width: 100%;
      height: calc(100vh - var(--header-h));
    }
    .map-wrap {
      flex: 1 1 auto;
      min-width: 0;
      height: 100%;
      position: relative;
      border-right: 1px solid #374151;
    }
    #map {
      width: 100%;
      height: 100%;
    }
    #teams-panel {
      flex: 0 0 var(--sidebar-w);
      width: var(--sidebar-w);
      display: flex;
      flex-direction: column;
      background: #111827;
      height: 100%;
      overflow: hidden;
    }
    .panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .75rem;
      padding: .75rem 1rem;
      border-bottom: 1px solid #374151;
      flex-shrink: 0;
    }
    .panel-header h2 {
      margin: 0;
      font-size: 1rem;
    }
    .pager {
      display: flex;
      align-items: center;
      gap: .4rem;
    }
    .pager button {
      background: #1f2937;
      color: #f9fafb;
      border: 1px solid #4b5563;
      border-radius: 8px;
      padding: .35rem .65rem;
      cursor: pointer;
      font-size: .85rem;
    }
    .pager button:disabled {
      opacity: .4;
      cursor: not-allowed;
    }
    .pager span {
      color: #9ca3af;
      font-size: .85rem;
      min-width: 4.5rem;
      text-align: center;
    }
    #teams {
      overflow: auto;
      padding: .75rem;
      flex: 1 1 auto;
    }
    .team-card {
      border: 1px solid #374151;
      border-radius: 12px;
      padding: .75rem;
      margin-bottom: .65rem;
      background: #1f2937;
      cursor: pointer;
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    .team-card:last-child { margin-bottom: 0; }
    .team-card:hover { border-color: #6b7280; }
    .team-card.is-selected {
      border-color: #4ade80;
      box-shadow: 0 0 0 1px #4ade80;
    }
    .team-card h3 {
      margin: 0;
      font-size: 1rem;
      display: flex;
      align-items: center;
      gap: .5rem;
    }
    .team-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #4ade80;
      flex-shrink: 0;
      cursor: zoom-in;
    }
    .meta {
      color: #d1d5db;
      font-size: .9rem;
    }
    .team-summary {
      margin-top: .35rem;
      color: #9ca3af;
      font-size: .8rem;
    }
    .team-details {
      display: none;
      margin-top: .75rem;
      border-top: 1px solid #374151;
      padding-top: .75rem;
    }
    .team-card.is-selected .team-details {
      display: block;
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: .5rem;
    }
    .stat {
      background: #111827;
      border-radius: 8px;
      padding: .5rem;
    }
    .stat strong {
      display: block;
      font-size: 1.05rem;
    }
    .tasks-section {
      margin-top: .9rem;
    }
    .tasks-section h4 {
      margin: 0 0 .5rem;
      font-size: .95rem;
      color: #e5e7eb;
    }
    .task-item {
      background: #111827;
      border-radius: 8px;
      padding: .65rem;
      margin-bottom: .5rem;
    }
    .task-item:last-child { margin-bottom: 0; }
    .task-item .task-title {
      font-size: .9rem;
      font-weight: 600;
      margin-bottom: .4rem;
    }
    .task-photos {
      display: flex;
      flex-wrap: wrap;
      gap: .4rem;
    }
    .task-photos img {
      width: 72px;
      height: 72px;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid #4b5563;
      cursor: zoom-in;
    }
    .empty-tasks {
      color: #9ca3af;
      font-size: .85rem;
    }
    .recommendations {
      margin-top: .75rem;
      padding-left: 1.25rem;
      font-size: .9rem;
    }
    .member-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid #fff;
      box-shadow: 0 0 0 1px rgba(0,0,0,.3);
      display: inline-block;
      flex-shrink: 0;
    }
    .maplibregl-popup-content {
      color: #111827;
      min-width: 160px;
    }
    .popup-photo {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #4ade80;
      display: block;
      margin: 0 auto .5rem;
      cursor: zoom-in;
    }
    .marker-label {
      background: #ef4444;
      color: #fff;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      white-space: nowrap;
    }
    .photo-marker {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #4ade80;
      box-shadow: 0 0 0 1px rgba(0,0,0,.25);
      cursor: pointer;
    }
    .photo-marker.is-selected {
      border-color: #fbbf24;
      box-shadow: 0 0 0 2px #fbbf24;
    }
    .lightbox {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(0,0,0,.82);
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      cursor: zoom-out;
    }
    .lightbox.is-open { display: flex; }
    .lightbox img {
      max-width: min(90vw, 640px);
      max-height: 85vh;
      border-radius: 12px;
      border: 2px solid #4ade80;
      object-fit: contain;
    }
    @media (max-width: 900px) {
      body { overflow: auto; height: auto; }
      main {
        flex-direction: column;
        height: auto;
      }
      .map-wrap {
        width: 100%;
        flex: none;
        height: 420px;
      }
      #teams-panel {
        width: 100%;
        flex: none;
        height: auto;
        min-height: 45vh;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Eurorace live</h1>
    <div class="meta">Pozycje, statystyki i zadania uczestników odświeżane automatycznie.</div>
  </header>
  <main>
    <div class="map-wrap">
      <div id="map"></div>
    </div>
    <aside id="teams-panel">
      <div class="panel-header">
        <h2>Uczestnicy</h2>
        <div class="pager">
          <button type="button" id="prev-page" aria-label="Poprzednia strona">←</button>
          <span id="page-label">1 / 1</span>
          <button type="button" id="next-page" aria-label="Następna strona">→</button>
        </div>
      </div>
      <section id="teams" aria-live="polite"></section>
    </aside>
  </main>
  <div id="lightbox" class="lightbox" role="dialog" aria-modal="true" aria-label="Powiększone zdjęcie">
    <img id="lightbox-img" src="" alt="">
  </div>

  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script>
    const STYLE_URL = "https://tiles.openfreemap.org/styles/liberty";
    const PAGE_SIZE = 6;
    const map = new maplibregl.Map({
      container: "map",
      style: STYLE_URL,
      center: [19.1451, 51.9194],
      zoom: 5.6,
      attributionControl: true,
    });
    map.addControl(new maplibregl.NavigationControl(), "top-right");

    const markers = new Map();
    let destinationMarker = null;
    const teamColors = ["#22c55e", "#3b82f6", "#f59e0b", "#ef4444", "#a855f7", "#14b8a6"];

    let allTeams = [];
    let currentPage = 0;
    let selectedTeamId = null;

    function preferPolishLabels() {
      const style = map.getStyle();
      if (!style || !style.layers) return;
      for (const layer of style.layers) {
        if (layer.type !== "symbol" || !layer.layout || !layer.layout["text-field"]) continue;
        try {
          map.setLayoutProperty(layer.id, "text-field", [
            "coalesce",
            ["get", "name:pl"],
            ["get", "name:latin"],
            ["get", "name"],
          ]);
        } catch (_) {}
      }
    }

    map.on("load", preferPolishLabels);
    map.on("styledata", preferPolishLabels);

    function formatDistance(meters) {
      if (!meters) return "0 km";
      return `${(meters / 1000).toFixed(1)} km`;
    }

    function formatDuration(seconds) {
      if (!seconds) return "0 h";
      const hours = Math.floor(seconds / 3600);
      const minutes = Math.floor((seconds % 3600) / 60);
      return `${hours} h ${minutes} min`;
    }

    function formatLastSeen(iso) {
      if (!iso) return "brak danych";
      const date = new Date(iso);
      if (Number.isNaN(date.getTime())) return String(iso);
      return date.toLocaleString("pl-PL", {
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
      });
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    function markerKey(teamId, memberId) {
      return `${teamId}:${memberId ?? "default"}`;
    }

    function openLightbox(url) {
      if (!url) return;
      const box = document.getElementById("lightbox");
      document.getElementById("lightbox-img").src = url;
      box.classList.add("is-open");
    }

    function closeLightbox() {
      const box = document.getElementById("lightbox");
      box.classList.remove("is-open");
      document.getElementById("lightbox-img").src = "";
    }

    document.getElementById("lightbox").addEventListener("click", closeLightbox);
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") closeLightbox();
    });

    function teamById(teamId) {
      return allTeams.find((team) => team.team_id === teamId) || null;
    }

    function pageForTeam(teamId) {
      const index = allTeams.findIndex((team) => team.team_id === teamId);
      if (index < 0) return 0;
      return Math.floor(index / PAGE_SIZE);
    }

    function createDotElement(color) {
      const el = document.createElement("span");
      el.className = "member-dot";
      el.style.background = color;
      el.style.width = "18px";
      el.style.height = "18px";
      el.style.cursor = "pointer";
      return el;
    }

    function createPhotoElement(photoUrl, selected) {
      const el = document.createElement("img");
      el.src = photoUrl;
      el.className = "photo-marker" + (selected ? " is-selected" : "");
      el.alt = "";
      return el;
    }

    function buildPopupHtml(team, location) {
      const title = `${team.bib_number ? `#${escapeHtml(team.bib_number)} ` : ""}${escapeHtml(team.display_name)}`;
      const member = escapeHtml(location.member_name || (team.members || []).join(", ") || "");
      const seen = formatLastSeen(location.timestamp || team.last_seen_at);
      const photo = team.profile_photo_url
        ? `<img class="popup-photo" src="${escapeHtml(team.profile_photo_url)}" alt="" data-lightbox="${escapeHtml(team.profile_photo_url)}">`
        : "";
      return `
        ${photo}
        <strong>${title}</strong><br>
        ${member ? `${member}<br>` : ""}
        <span>Ostatnio widziany:<br><strong>${escapeHtml(seen)}</strong></span>
      `;
    }

    function setMarker(key, lngLat, element, popupHtml, teamId) {
      if (markers.has(key)) {
        markers.get(key).remove();
        markers.delete(key);
      }
      const popup = new maplibregl.Popup({ offset: 12 }).setHTML(popupHtml);
      popup.on("open", () => {
        const root = popup.getElement();
        if (!root) return;
        root.querySelectorAll("[data-lightbox]").forEach((img) => {
          img.addEventListener("click", (event) => {
            event.stopPropagation();
            openLightbox(img.getAttribute("data-lightbox"));
          });
        });
      });
      const marker = new maplibregl.Marker({ element })
        .setLngLat(lngLat)
        .setPopup(popup)
        .addTo(map);

      element.addEventListener("click", (event) => {
        event.stopPropagation();
        selectTeam(teamId, { fromMap: true, markerKey: key });
      });

      markers.set(key, marker);
    }

    function renderDestination(destination) {
      if (!destination) {
        if (destinationMarker) {
          destinationMarker.remove();
          destinationMarker = null;
        }
        return;
      }
      const lngLat = [destination.longitude, destination.latitude];
      const label = destination.name || "Meta";
      if (destinationMarker) {
        destinationMarker.remove();
        destinationMarker = null;
      }
      const el = document.createElement("span");
      el.className = "marker-label";
      el.textContent = "META";
      destinationMarker = new maplibregl.Marker({ element: el })
        .setLngLat(lngLat)
        .setPopup(new maplibregl.Popup({ offset: 12 }).setHTML(`<strong>Meta: ${escapeHtml(label)}</strong>`))
        .addTo(map);
    }

    function updateMapMarkers(teams) {
      const seen = new Set();
      teams.forEach((team, teamIndex) => {
        const color = teamColors[teamIndex % teamColors.length];
        const locations = team.member_locations?.length
          ? team.member_locations
          : (team.location ? [team.location] : []);
        const selected = selectedTeamId === team.team_id;

        locations.forEach((location) => {
          const key = markerKey(team.team_id, location.member_id);
          seen.add(key);
          const lngLat = [location.longitude, location.latitude];
          const element = team.profile_photo_url
            ? createPhotoElement(team.profile_photo_url, selected)
            : createDotElement(color);
          if (selected && !team.profile_photo_url) {
            element.style.outline = "2px solid #fbbf24";
          }
          setMarker(key, lngLat, element, buildPopupHtml(team, location), team.team_id);
        });
      });

      for (const [key, marker] of markers.entries()) {
        if (!seen.has(key)) {
          marker.remove();
          markers.delete(key);
        }
      }
    }

    function totalPages() {
      return Math.max(1, Math.ceil(allTeams.length / PAGE_SIZE));
    }

    function renderPager() {
      const pages = totalPages();
      if (currentPage >= pages) currentPage = pages - 1;
      if (currentPage < 0) currentPage = 0;
      document.getElementById("page-label").textContent = `${currentPage + 1} / ${pages}`;
      document.getElementById("prev-page").disabled = currentPage <= 0;
      document.getElementById("next-page").disabled = currentPage >= pages - 1;
    }

    function renderTaskItems(tasks) {
      const items = tasks?.items || [];
      if (!items.length) {
        return `<div class="empty-tasks">Brak ukończonych zadań</div>`;
      }
      return items.map((task) => {
        const photos = (task.photos || []).map((url) =>
          `<img src="${escapeHtml(url)}" alt="" data-lightbox="${escapeHtml(url)}">`
        ).join("");
        return `
          <div class="task-item">
            <div class="task-title">${escapeHtml(task.title)}</div>
            ${photos ? `<div class="task-photos">${photos}</div>` : `<div class="empty-tasks">Brak zdjęć</div>`}
          </div>
        `;
      }).join("");
    }

    function renderTeamCards() {
      const panel = document.getElementById("teams");
      panel.innerHTML = "";
      renderPager();

      const start = currentPage * PAGE_SIZE;
      const pageTeams = allTeams.slice(start, start + PAGE_SIZE);

      pageTeams.forEach((team) => {
        const globalIndex = allTeams.indexOf(team);
        const color = teamColors[globalIndex % teamColors.length];
        const stats = team.statistics || {};
        const card = document.createElement("article");
        card.className = "team-card" + (selectedTeamId === team.team_id ? " is-selected" : "");
        card.dataset.teamId = String(team.team_id);

        const avatar = team.profile_photo_url
          ? `<img src="${escapeHtml(team.profile_photo_url)}" class="team-avatar" alt="" data-lightbox="${escapeHtml(team.profile_photo_url)}">`
          : `<span class="member-dot" style="background:${color}"></span>`;

        card.innerHTML = `
          <h3>${avatar}<span>${team.bib_number ? `#${escapeHtml(team.bib_number)} ` : ""}${escapeHtml(team.display_name)}</span></h3>
          <div class="meta">${escapeHtml((team.members || []).join(", ") || "Brak wpisanych członków")}</div>
          <div class="team-summary">Zadania ${team.tasks?.completed || 0}/${team.tasks?.total || 0} · ${formatDistance(stats.distance_meters)} · kliknij po szczegóły</div>
          <div class="team-details">
            <div class="stats">
              <div class="stat"><span>Trasa</span><strong>${formatDistance(stats.distance_meters)}</strong></div>
              <div class="stat"><span>Czas</span><strong>${formatDuration(stats.duration_seconds)}</strong></div>
              <div class="stat"><span>Przewyższenia</span><strong>${Math.round(stats.elevation_gain_meters || 0)} m</strong></div>
              <div class="stat"><span>Stopy</span><strong>${stats.hitch_count || 0}</strong></div>
              <div class="stat"><span>Zadania</span><strong>${team.tasks?.completed || 0}/${team.tasks?.total || 0}</strong></div>
            </div>
            <div class="tasks-section">
              <h4>Ukończone zadania</h4>
              ${renderTaskItems(team.tasks)}
            </div>
            ${
              (team.recommendations || []).length
                ? `<h4 style="margin:.75rem 0 .35rem;font-size:.95rem">Najbliższe miejsca do stopa</h4><ol class="recommendations">${team.recommendations.map((rec) => `<li>${escapeHtml(rec.spot?.title || "")} (${formatDistance(rec.distance_meters)})</li>`).join("")}</ol>`
                : ""
            }
          </div>
        `;

        card.addEventListener("click", (event) => {
          if (event.target.closest("[data-lightbox]")) {
            event.stopPropagation();
            openLightbox(event.target.getAttribute("data-lightbox") || event.target.src);
            return;
          }
          selectTeam(team.team_id, { fromSidebar: true });
        });

        panel.appendChild(card);
      });
    }

    function openTeamPopup(teamId) {
      const team = teamById(teamId);
      if (!team) return;
      const locations = team.member_locations?.length
        ? team.member_locations
        : (team.location ? [team.location] : []);
      if (!locations.length) return;
      const key = markerKey(team.team_id, locations[0].member_id);
      const marker = markers.get(key);
      if (marker) {
        marker.togglePopup();
        if (!marker.getPopup().isOpen()) marker.togglePopup();
      }
    }

    function selectTeam(teamId, options = {}) {
      if (selectedTeamId === teamId && options.fromSidebar) {
        selectedTeamId = null;
        updateMapMarkers(allTeams);
        renderTeamCards();
        return;
      }
      selectedTeamId = teamId;
      const neededPage = pageForTeam(teamId);
      if (currentPage !== neededPage) currentPage = neededPage;
      updateMapMarkers(allTeams);
      renderTeamCards();
      if (options.fromMap || options.fromSidebar) {
        openTeamPopup(teamId);
      }
      const card = document.querySelector(`.team-card[data-team-id="${teamId}"]`);
      if (card) card.scrollIntoView({ block: "nearest", behavior: "smooth" });
    }

    document.getElementById("prev-page").addEventListener("click", () => {
      if (currentPage > 0) {
        currentPage -= 1;
        renderTeamCards();
      }
    });
    document.getElementById("next-page").addEventListener("click", () => {
      if (currentPage < totalPages() - 1) {
        currentPage += 1;
        renderTeamCards();
      }
    });

    async function refresh() {
      const response = await fetch("{% url 'live-dashboard-data' %}");
      const data = await response.json();
      allTeams = data.teams || [];
      renderDestination(data.destination);
      updateMapMarkers(allTeams);
      renderTeamCards();
      map.resize();
    }

    refresh();
    setInterval(refresh, 15000);
    window.addEventListener("resize", () => map.resize());
  </script>
</body>
</html>
